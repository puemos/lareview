[package]
name = "lareview"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
default-run = "lareview"

license = "MIT OR Apache-2.0"
autobins = false
description = "LaReview is a desktop code review companion that generates intent-driven review plans with AI."
repository = "https://github.com/puemos/lareview"
homepage = "https://github.com/puemos/lareview"
readme = "README.md"
keywords = ["code-review", "gui", "ai", "acp", "developer-tools"]
categories = ["development-tools", "gui"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.4"
clap = { version = "4.4", features = ["derive"] }
dirs = "6"
log = "0.4"
env_logger = "0.11.3"

agent-client-protocol = "2.0.0"
grep = "0.4"
ignore = "0.4"
globset = "0.4"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full", "process"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
which = "8"
anyhow = "1.0"
thiserror = "2"
async-trait = "0.1"
libc = "0.2"
pmcp = "2.17.0"
tempfile = "3"
chrono = { version = "0.4", features = ["clock"] }
unidiff = "0.4.0"
handlebars = "6.3.2"
once_cell = "1.21.3"
toml = "1"
home = "0.5"
image = "0.25"
regex = "1"
lazy_static = "1.4"
twox-hash = "2"
uuid = { version = "1", features = ["v4"] }

tauri = { version = "2.11.5", features = [] }
tauri-plugin-cli = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
parking_lot = "0.12"
tauri-plugin-dialog = "2"
fix-path-env = { version = "=0.0.0", git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }

[lib]
name = "lareview"
path = "src/lib.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "lareview"
path = "src/main.rs"

[[example]]
name = "fake_acp_agent"
path = "examples/fake_acp_agent.rs"

[dev-dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

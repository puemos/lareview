allowBuilds:
  esbuild: true

overrides:
  # Monaco pins an older DOMPurify; keep its sanitizer patched.
  dompurify@<3.4.17: ^3.4.17
  # Mermaid 11 needs the prototype-pollution fix in KaTeX 0.18.2.
  mermaid>katex: ^0.18.2
  # Tailwind Typography pins the vulnerable 6.0.x parser.
  postcss-selector-parser@<6.1.5: ^6.1.5

peerDependencyRules:
  allowedVersions:
    eslint: "10"

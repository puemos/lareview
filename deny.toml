# Cargo-deny configuration

[graph]
all-features = false
no-default-features = false
targets = []

[output]
feature-depth = 1

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste remains transitive through image's EXR/AVIF codecs; no maintained compatible replacement is available upstream" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is build-time-only through Tauri's required GTK3 bindings; no maintained compatible release exists" },
    { id = "RUSTSEC-2024-0411", reason = "Tauri 2.11 still requires the archived GTK3/WebKit stack on Linux; migrate when Tauri supports a maintained Linux webview stack" },
    { id = "RUSTSEC-2024-0412", reason = "Tauri 2.11 still requires the archived GTK3/WebKit stack on Linux; migrate when Tauri supports a maintained Linux webview stack" },

    { id = "RUSTSEC-2024-0414", reason = "Tauri 2.11 still requires the archived GTK3/WebKit stack on Linux; migrate when Tauri supports a maintained Linux webview stack" },
    { id = "RUSTSEC-2024-0415", reason = "Tauri 2.11 still requires the archived GTK3/WebKit stack on Linux; migrate when Tauri supports a maintained Linux webview stack" },
    { id = "RUSTSEC-2024-0416", reason = "Tauri 2.11 still requires the archived GTK3/WebKit stack on Linux; migrate when Tauri supports a maintained Linux webview stack" },
    { id = "RUSTSEC-2024-0417", reason = "Tauri 2.11 still requires the archived GTK3/WebKit stack on Linux; migrate when Tauri supports a maintained Linux webview stack" },
    { id = "RUSTSEC-2024-0418", reason = "Tauri 2.11 still requires the archived GTK3/WebKit stack on Linux; migrate when Tauri supports a maintained Linux webview stack" },
    { id = "RUSTSEC-2024-0419", reason = "Tauri 2.11 still requires the archived GTK3/WebKit stack on Linux; migrate when Tauri supports a maintained Linux webview stack" },
    { id = "RUSTSEC-2024-0420", reason = "Tauri 2.11 still requires the archived GTK3/WebKit stack on Linux; migrate when Tauri supports a maintained Linux webview stack" },
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 is pinned by Tauri's required GTK3/WebKit Linux stack; LaReview does not use VariantStrIter directly" },
    { id = "RUSTSEC-2025-0075", reason = "urlpattern is transitive through Tauri 2.11 and has no compatible release without the archived rust-unic crates" },
    { id = "RUSTSEC-2025-0080", reason = "urlpattern is transitive through Tauri 2.11 and has no compatible release without the archived rust-unic crates" },

# Cargo-deny configuration

[graph]
all-features = false
no-default-features = false
targets = []

[output]
feature-depth = 1

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is build-time-only through Tauri's required GTK3 bindings; no maintained compatible release exists" },
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 is pinned by Tauri's required GTK3/WebKit Linux stack; LaReview does not use VariantStrIter directly" },
    { id = "RUSTSEC-2026-0370", reason = "tauri-plugin-single-instance 2.5 requires zbus 5 and its standalone zvariant crate; removal requires upstream migration to zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "tauri-plugin-single-instance 2.5 requires zbus 5 and its standalone zbus_names crate; removal requires upstream migration to zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "tauri-plugin-single-instance 2.5 requires zbus 5 and its standalone zvariant_derive crate; removal requires upstream migration to zbus 6" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "MPL-2.0",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "NCSA",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []
allow = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/tauri-apps/fix-path-env-rs"]
